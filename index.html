<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greater Love</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #f4f4f4;
      line-height: 1.6;
    }

    header {
      padding: 70px 20px;
      text-align: center;
      background: #05070a;
      color: #ffffff;
      border-bottom: 1px solid #27313f;
    }

    header h1 {
      font-size: 36px;
      max-width: 900px;
      margin: 0 auto 15px;
      line-height: 1.25;
    }

    header p {
      font-size: 18px;
      margin: 0;
      color: #b8c0cc;
    }

    section {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    h2 {
      font-size: 30px;
      color: #ffffff;
      border-bottom: 2px solid #3b4658;
      padding-bottom: 10px;
    }

    .media-box {
      background: #121821;
      padding: 20px;
      margin-top: 20px;
      border-radius: 12px;
      border: 1px solid #27313f;
      box-shadow: 0 2px 12px rgba(0,0,0,0.35);
    }

    iframe {
      width: 100%;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    iframe:last-child {
      margin-bottom: 0;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      background: #05070a;
      color: #b8c0cc;
      margin-top: 60px;
      border-top: 1px solid #27313f;
    }
  </style>
</head>

<body>

  <header>
    <h1>Greater love hath no man than this, that a man lay down his life for his friends.</h1>
    <p>John 15:13 · King James Version</p>
  </header>

  <section id="youtube">
    <h2>YouTube</h2>

    <div class="media-box">
      <iframe
        height="315"
        src="https://www.youtube.com/embed/BudKMSozOKY"
        title="YouTube video player"
        allowfullscreen>
      </iframe>

      <iframe
        height="315"
        src="https://www.youtube.com/embed/V71eVoMVjAM"
        title="YouTube video player"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <section id="podcasts">
    <h2>Podcasts</h2>

    <div class="media-box">
      <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/episode/7chzq39RqWXSByELBciQnV"
        height="232"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>

      <iframe
        style="border-radius:12px"
        src="https://open.spotify.com/embed/episode/7FccEIViAH6UL6BjhJYpfH"
        height="232"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy">
      </iframe>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Greater Love</p>
  </footer>

</body>
</html>
